<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="المساعد الذكي SmartHub AI">
<title>SmartHub AI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="assistant-body assistant-minimal">
<main class="minimal-chat">
  <section id="aiChatMessages" class="chat-stage" aria-live="polite">
    <div id="welcomePanel" class="assistant-welcome">
      <h1>مرحباً</h1>
    </div>
  </section>
  <div class="composer-wrap">
    <div class="composer-box">
      <textarea id="aiChatInput" rows="1" maxlength="8000" aria-label="اكتب رسالتك" placeholder="اكتب رسالتك..."></textarea>
      <div class="composer-bottom">
        <span id="charCount" class="composer-count" aria-hidden="true"></span>
        <button id="sendChat" type="button" aria-label="إرسال" title="إرسال"><span>↑</span></button>
      </div>
    </div>
    <p id="aiChatStatus" role="status" class="visually-hidden" aria-live="polite"></p>
  </div>
</main>
<script src="config.js"></script>
<script src="chat.js"></script>
</body>
</html>
