<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="المساعد الذكي SmartHub AI">
<title>المساعد الذكي | SmartHub AI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="assistant-body assistant-minimal">
<main class="minimal-assistant">
  <section id="aiChatMessages" class="minimal-replies" aria-live="polite" aria-label="ردود المحادثة"></section>
  <div class="minimal-composer">
    <textarea id="aiChatInput" rows="1" maxlength="8000" aria-label="اكتب رسالتك" placeholder="اكتب رسالتك هنا..."></textarea>
    <button id="sendChat" type="button" aria-label="إرسال الرسالة" title="إرسال">↑</button>
  </div>
</main>
<script src="config.js"></script>
<script src="chat.js"></script>
</body>
</html>
