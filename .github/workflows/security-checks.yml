name: Security checks
on:
  push:
    branches: [main, feature/smarthub-tools-auth-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependency auditor
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit API dependencies
        run: pip-audit -r api/requirements.txt

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python API modules
        run: python -m compileall -q api
      - name: Install API runtime dependencies for tests
        run: python -m pip install -r api/requirements.txt
      - name: Run API security unit tests
        run: python -m unittest discover -s api/tests -v
      - name: Check JavaScript syntax
        run: |
          find . -type f -name '*.js' ! -name 'video-studio.js' -print0 | xargs -0 -n1 node --check
          node --input-type=module --check < video-studio.js
