name: Android signed release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Stage website files
        run: npm run prepare:mobile

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android release
        working-directory: android
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Sign APK and AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/smarthub-release.jks"
          mkdir -p signed
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$APK"
          test -n "$AAB"
          jarsigner -keystore "$RUNNER_TEMP/smarthub-release.jks" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD -signedjar signed/SmartHub-AI-release-unsigned-alias.apk "$APK" "$ANDROID_KEY_ALIAS"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/smarthub-release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out signed/SmartHub-AI-release.apk signed/SmartHub-AI-release-unsigned-alias.apk
          jarsigner -keystore "$RUNNER_TEMP/smarthub-release.jks" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD "$AAB" "$ANDROID_KEY_ALIAS"
          cp "$AAB" signed/SmartHub-AI-release.aab
          "$APKSIGNER" verify --verbose signed/SmartHub-AI-release.apk
          jarsigner -verify signed/SmartHub-AI-release.aab
          rm -f "$RUNNER_TEMP/smarthub-release.jks" signed/SmartHub-AI-release-unsigned-alias.apk

      - name: Upload signed Android release
        uses: actions/upload-artifact@v4
        with:
          name: smarthub-ai-signed-release
          if-no-files-found: error
          path: |
            signed/SmartHub-AI-release.apk
            signed/SmartHub-AI-release.aab
