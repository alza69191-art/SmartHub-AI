name: API syntax check
on:
  push:
    branches: [main, feature/smarthub-tools-auth-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile API source files
        run: python -m compileall -q api
