<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="توليد الصور عبر مزودين مختلفين داخل SmartHub AI">
<title>مولّد الصور | SmartHub AI</title>
<link rel="stylesheet" href="styles.css">
<style>
.generator{max-width:900px;margin:36px auto;padding:24px}
.generator-card{background:linear-gradient(145deg,#321c60,#21123f);border:1px solid var(--line);border-radius:18px;padding:24px}
.generator h1{margin:4px 0 8px}.generator .muted{color:var(--muted)}
.generator textarea,.generator input,.generator select{width:100%;background:#160d30;color:#fff;border:1px solid var(--line);border-radius:10px;padding:13px;font:15px Tajawal}
.generator textarea{min-height:150px;resize:vertical}
.generator label{display:block;margin:14px 0 6px;color:#e0d4f6}
.generator .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.generator .check{display:flex;align-items:center;gap:9px}.generator .check input{width:auto}
.generator button{margin-top:18px;background:linear-gradient(120deg,#9259e8,#6338bb);border:0;color:#fff;padding:12px 22px;border-radius:10px;font-weight:700}
.generator button:disabled{opacity:.55;cursor:wait}
#status{min-height:26px;color:var(--muted);margin:12px 0}
#result{display:none;margin-top:22px;text-align:center}
#result img{display:block;max-width:100%;max-height:720px;margin:0 auto;border-radius:12px;border:1px solid var(--line)}
#download{display:inline-block;margin-top:12px;color:var(--purple-light)}
@media(max-width:600px){.generator{padding:16px}.generator-card{padding:17px}.generator .row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="site-header"><a class="logo" href="index.html">✦ SmartHub <b>AI</b></a><nav class="top-nav"><a class="top-link" href="index.html">الرئيسية</a><a class="top-link" href="tools.html">الأدوات</a><a class="top-link" href="assistant.html">المساعد الذكي</a></nav><div class="header-actions"><a class="register-nav-button" href="account.html">الحساب</a></div></header>
<main class="generator"><section class="generator-card">
<small>GOOGLE GEMINI · OVHCLOUD · POLLINATIONS · CLOUDFLARE</small><h1>مولّد الصور</h1><p class="muted">اكتب وصف الصورة باللغة العربية أو الإنجليزية. يستخدم Google Gemini افتراضياً. يلزم تسجيل الدخول لاستخدام الأداة.</p>
<label for="prompt">وصف الصورة</label><textarea id="prompt" maxlength="4000" placeholder="صف الصورة التي تريد إنشاءها بالتفصيل..."></textarea>
<label for="provider">مزود توليد الصور</label><select id="provider"><option value="gemini">Google Gemini – Nano Banana 2</option><option value="ovh">OVHcloud – Stable Diffusion XL</option><option value="pollinations">Pollinations – FLUX (يتطلب مفتاحاً)</option><option value="cloudflare">Cloudflare – FLUX (يتطلب مفتاحاً)</option></select>
<label for="quality">عدد خطوات التوليد</label><select id="quality"><option value="speed">سريعة – 4 خطوات</option><option value="quality">تفاصيل أكثر – 8 خطوات</option></select>
<button id="generate" type="button">إنشاء الصورة</button><p><a href="image-editor.html">انتقل إلى أداة تعديل الصور ↗</a></p><p id="status" role="status"></p>
<div id="result"><img id="output" alt="الصورة المولدة"><a id="download" download="smarthub-ai-image.png">تنزيل الصورة</a></div>
</section></main>
<script src="config.js"></script><script src="image-generator.js"></script>
</body></html>
